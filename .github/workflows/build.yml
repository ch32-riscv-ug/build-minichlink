name: build and release

on:
  schedule:
    # Daily, offset from the hour to avoid the busiest scheduler window.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "ch32fun commit-ish to build"
        required: false
        default: "master"
        type: string
      dry_run:
        description: "Build artifacts without committing or publishing"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - build.sh
      - build-config.sh
      - make_source_bundle.sh
      - emit_fragment.py
      - resolve_version.py
      - .github/workflows/build.yml

permissions:
  contents: write

concurrency:
  group: build-minichlink-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.version.outputs.should_build }}
      reason: ${{ steps.version.outputs.reason }}
      version: ${{ steps.version.outputs.version }}
      build_revision: ${{ steps.version.outputs.build_revision }}
      upstream_sha: ${{ steps.version.outputs.upstream_sha }}
      upstream_date: ${{ steps.version.outputs.upstream_date }}
      dry_run: ${{ steps.parameters.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve parameters
        id: parameters
        shell: bash
        run: |
          source ./build-config.sh
          ref="${{ inputs.ref }}"
          if [[ -z "$ref" ]]; then ref="$UPSTREAM_DEFAULT_REF"; fi
          case "${{ github.event_name }}" in
            schedule) mode=schedule ;;
            push) mode=push ;;
            *) mode=manual ;;
          esac
          dry_run="${{ inputs.dry_run }}"
          if [[ "$dry_run" != "true" ]]; then dry_run=false; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: cnlohr/ch32fun
          ref: ${{ steps.parameters.outputs.ref }}
          path: src/ch32fun
          fetch-depth: 1

      - name: Assign version
        id: version
        run: |
          python3 ./resolve_version.py \
            --upstream src/ch32fun \
            --versions versions \
            --builder-sha "${{ github.sha }}" \
            --mode "${{ steps.parameters.outputs.mode }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "Reason: ${{ steps.version.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Upstream: ${{ steps.version.outputs.upstream_sha }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.version.outputs.should_build }}" == "true" ]]; then
            echo "Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: x86_64-pc-linux-gnu
            runner: ubuntu-latest
            packages: build-essential libudev-dev
          - host: aarch64-linux-gnu
            runner: ubuntu-24.04-arm
            packages: build-essential libudev-dev
          - host: x86_64-apple-darwin
            runner: macos-latest
            packages: ""
          - host: arm64-apple-darwin
            runner: macos-latest
            packages: ""
          - host: x86_64-mingw32
            runner: ubuntu-latest
            packages: make gcc-mingw-w64-x86-64 zip
          - host: i686-mingw32
            runner: ubuntu-latest
            packages: make gcc-mingw-w64-i686 zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: cnlohr/ch32fun
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: src/ch32fun
          fetch-depth: 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl bzip2 file python3 ${{ matrix.packages }}

      - name: Build ${{ matrix.host }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM_DIR: ${{ github.workspace }}/src/ch32fun
          RUNNER_NAME: ${{ matrix.runner }}
          BUILD_JOBS: "3"
        run: ./build.sh "${{ matrix.host }}"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.host }}
          path: dist/${{ matrix.host }}/
          if-no-files-found: error
          retention-days: 14

  assemble:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/checkout@v6
        with:
          repository: cnlohr/ch32fun
          ref: ${{ needs.prepare.outputs.upstream_sha }}
          path: src/ch32fun
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          path: dist

      - name: Create corresponding source bundle
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          UPSTREAM_DIR: ${{ github.workspace }}/src/ch32fun
          BUILDER_SHA: ${{ github.sha }}
        run: ./make_source_bundle.sh

      - name: Generate release metadata
        run: |
          source ./build-config.sh
          python3 ./emit_fragment.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --upstream-sha "${{ needs.prepare.outputs.upstream_sha }}" \
            --upstream-date "${{ needs.prepare.outputs.upstream_date }}" \
            --builder-sha "${{ github.sha }}" \
            --build-revision "${{ needs.prepare.outputs.build_revision }}" \
            --libusb-version "$LIBUSB_VERSION" \
            --libusb-sha256 "$LIBUSB_SHA256" \
            --repo "$GITHUB_REPOSITORY" \
            --source-bundle "dist/minichlink-${{ needs.prepare.outputs.version }}-sources.tar.gz"

      - name: Write release notes
        run: |
          cat > dist/release-notes.md <<'EOF'
          Cross-platform build of [minichlink](https://github.com/cnlohr/ch32fun/tree/master/minichlink).

          These files are build outputs only. This repository verifies the build, archive layout,
          checksums, and link dependencies; it does not test or guarantee operation with any probe,
          target, or consumer environment.

          `tools_minichlink.json` is an Arduino tool-definition fragment. The corresponding build
          recipe is recorded under `versions/`, and the source bundle contains the exact ch32fun and
          libusb inputs needed to rebuild or relink.

          This project is independent of and not endorsed by ch32fun, CNLohr, or libusb. See
          `THIRD-PARTY-NOTICE.md` for licenses and redistribution information.
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ needs.prepare.outputs.version }}
          path: |
            dist/
            versions/${{ needs.prepare.outputs.version }}.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish append-only release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists; refusing to modify it" >&2
            exit 1
          fi

          assets=()
          while IFS= read -r -d '' file; do assets+=("$file"); done < <(
            find dist -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name 'tools_minichlink.json' \) -print0
          )
          assets+=("THIRD-PARTY-NOTICE.md")
          gh release create "$tag" --draft --target "${{ github.sha }}" \
            --title "minichlink $VERSION" --notes-file dist/release-notes.md \
            "${assets[@]}"

          record_pushed=false
          cleanup_draft() {
            if [[ "$record_pushed" != true ]]; then
              gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_draft EXIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "versions/$VERSION.json"
          git commit -m "build: record minichlink $VERSION"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          record_pushed=true

          gh release edit "$tag" --draft=false
          trap - EXIT

  keepalive:
    needs: prepare
    if: needs.prepare.outputs.should_build != 'true' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Prevent scheduled workflow auto-disable
        run: |
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit age: ${age_days} day(s)"
          if [[ "$age_days" -ge 50 ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: prevent scheduled workflow auto-disable"
            git push
          fi
